<script>
const $ = id => document.getElementById(id);
function bell(t, a, b) { if (t < a || t > b) return 0; const u = (t - a) / (b - a); return Math.sin(Math.PI * u); }
function blink(t, times) { let s = 1; for (const bt of times) { const d = Math.abs(t - bt); const p = Math.max(0, 1 - d / 0.12); s = Math.min(s, 1 - 0.92 * p * p); } return s; }
function render(t) {
  const T = t % 5;
  const z = 1 + 0.04 * (T / 5);
  $('cam').setAttribute('transform', `translate(960 540) scale(${z}) translate(-960 -540)`);
  const spB = bell(T, 0.15, 2.6), spA = bell(T, 2.5, 4.95);
  const bobB = Math.sin(2 * Math.PI * 1.8 * T), bobA = Math.sin(2 * Math.PI * 1.8 * T + 2.1);
  $('bHead').setAttribute('transform', `translate(0 ${(3 * bobB * spB + 1.5 * bobB).toFixed(2)}) rotate(${(1.6 * bobB).toFixed(2)} 560 560)`);
  $('aHead').setAttribute('transform', `translate(0 ${(3 * bobA * spA + 1.5 * bobA).toFixed(2)}) rotate(${(-1.6 * bobA).toFixed(2)} 1360 560)`);
  $('bEyes').setAttribute('transform', `translate(561 465) scale(1 ${blink(T, [0.8, 2.3, 4.1]).toFixed(3)}) translate(-561 -465)`);
  $('aEyes').setAttribute('transform', `translate(1359 465) scale(1 ${blink(T, [1.4, 3.0, 4.6]).toFixed(3)}) translate(-1359 -465)`);
  $('bBrow').setAttribute('transform', `translate(0 ${(-4 * spB).toFixed(2)})`);
  $('aBrow').setAttribute('transform', `translate(0 ${(-4 * spA).toFixed(2)})`);
  $('bMouth').setAttribute('ry', (1.5 + 9 * spB * Math.abs(Math.sin(2 * Math.PI * 3 * T))).toFixed(2));
  $('aMouth').setAttribute('ry', (1.5 + 9 * spA * Math.abs(Math.sin(2 * Math.PI * 3 * T + 1))).toFixed(2));
  $('bArm').setAttribute('transform', `rotate(${(-8 - 20 * spB + 3 * Math.sin(2 * Math.PI * 1.8 * T)).toFixed(2)} 648 690)`);
  $('aArm').setAttribute('transform', `rotate(${(4 + 6 * spA * Math.sin(2 * Math.PI * 1.8 * T + 2.1)).toFixed(2)} 1290 690)`);
  $('micB').setAttribute('transform', `rotate(${(1.3 * Math.sin(2 * Math.PI * 0.9 * T)).toFixed(3)} 640 60)`);
  $('micA').setAttribute('transform', `rotate(${(-1.3 * Math.sin(2 * Math.PI * 0.9 * T + 0.7)).toFixed(3)} 1280 60)`);
  $('rays').setAttribute('opacity', (0.85 + 0.15 * Math.sin(2 * Math.PI * 0.4 * T)).toFixed(3));
  $('sun').setAttribute('opacity', (0.9 + 0.1 * Math.sin(2 * Math.PI * 0.6 * T)).toFixed(3));
  document.querySelectorAll('.steam').forEach((el, i) => {
    const p = (T * 0.9 + i * 0.37) % 1;
    el.setAttribute('transform', `translate(0 ${(-46 * p).toFixed(1)})`);
    el.setAttribute('opacity', (0.55 * (1 - p)).toFixed(3));
  });
  $('plant').setAttribute('transform', `rotate(${(3 * Math.sin(2 * Math.PI * 0.7 * T)).toFixed(2)} 1745 562)`);
}
window.render = render;
render(0);
</script>
